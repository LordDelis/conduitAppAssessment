name: End-to-End & API Testing Pipeline

on: push

jobs:
  test-suite:
    name: Run Cypress and Newman Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysecretpassword
          MYSQL_DATABASE: realworld-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmysecretpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Newman & Reporters
        run: npm install -g newman newman-reporter-htmlextra

      # Run in the background, log to a file
      - name: Start Local Server
        run: |
          nohup npm run dev > server.log 2>&1 &
          echo "Server starting in background..."
        env:
          JWT_KEY: "super-secret-dev-key-for-github-actions"
          DB_HOST: "127.0.0.1"
          DB_USER: "root"
          DB_PASSWORD: "mysecretpassword"
          DB_NAME: "realworld-db"

      # Block until both ports accept connections (fails after 60s)
      - name: Wait for Server
        run: npx wait-on tcp:3000 tcp:3001 --timeout 60000

      - name: Execute Postman API Tests (Newman)
        run: |
          mkdir -p reports
          newman run postman/collection.json \
            -e postman/environment.json \
            -r cli,htmlextra \
            --reporter-htmlextra-export ./reports/postman-report.html \
            --insecure

      - name: Execute Cypress UI Tests
        if: ${{ !cancelled() }}
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          record: false
        env:
          CYPRESS_baseUrl: http://localhost:3000

      # Handy for debugging when something fails
      - name: Print Server Logs
        if: failure()
        run: cat server.log

      - name: Upload Test Reports Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-test-execution-reports
          path: |
            ./reports/
            cypress/screenshots/
            cypress/videos/
          retention-days: 7